<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ApnaBhojpuri</title>

  <meta
    name="description"
    content="Bhojpuri music - ApnaBhojpuri"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      font-family: Arial, sans-serif;
      color: #222222;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 32px 24px;
      text-align: center;
    }

    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ff6b00;
      color: #ffffff;
      font-size: 36px;
      font-weight: 800;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    p {
      margin: 0 0 24px;
      color: #666666;
      line-height: 1.5;
    }

    .button {
      display: inline-block;
      padding: 14px 24px;
      border-radius: 12px;
      background: #ff6b00;
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
    }

    .small {
      margin-top: 18px;
      font-size: 13px;
      color: #999999;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      ♪
    </div>

    <h1>ApnaBhojpuri</h1>

    <p>
      Bhojpuri Music • Masti • Community
    </p>

    <a
      class="button"
      href="https://play.google.com/store/apps/details?id=com.apnabhojpuri.apna_bhojpuri"
    >
      Get ApnaBhojpuri App
    </a>

    <div class="small">
      Bhojpuri songs sunne ke liye app install karein.
    </div>

  </div>

</body>
</html>
