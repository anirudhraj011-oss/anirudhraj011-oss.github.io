<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ApnaBhojpuri</title>

  <meta
    name="description"
    content="Listen to Bhojpuri songs on ApnaBhojpuri"
  >

  <meta
    http-equiv="refresh"
    content="5;url=https://play.google.com/store/apps/details?id=com.apnabhojpuri.apna_bhojpuri"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #ffffff;

      font-family:
        Arial,
        sans-serif;

      color: #222222;
    }

    .container {
      width: 100%;
      max-width: 420px;

      padding: 32px 24px;

      text-align: center;
    }

    .logo {
      width: 82px;
      height: 82px;

      margin: 0 auto 20px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #ff6b00;

      color: #ffffff;

      font-size: 38px;
      font-weight: 800;
    }

    h1 {
      margin: 0 0 10px;

      font-size: 28px;
      font-weight: 800;
    }

    p {
      margin: 0 auto 24px;

      max-width: 320px;

      color: #666666;

      font-size: 15px;

      line-height: 1.5;
    }

    .button {
      display: inline-block;

      padding: 14px 24px;

      border-radius: 12px;

      background: #ff6b00;

      color: #ffffff;

      text-decoration: none;

      font-size: 15px;

      font-weight: 700;
    }

    .small {
      margin-top: 18px;

      color: #999999;

      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      ♪
    </div>

    <h1>
      ApnaBhojpuri
    </h1>

    <p>
      Bhojpuri songs sunne ke liye
      ApnaBhojpuri app install karein.
    </p>

    <a
      class="button"
      href="https://play.google.com/store/apps/details?id=com.apnabhojpuri.apna_bhojpuri"
    >
      Get ApnaBhojpuri App
    </a>

    <div class="small">
      Play Store par redirect ho raha hai...
    </div>

  </div>

</body>
</html>
